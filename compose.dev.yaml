services:
  postgres:
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks:
      - data
      - dev-access

  redis:
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    networks:
      - data
      - dev-access

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - data
      - dev-access
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  dev-access:
    name: sodai-dev-access
